# Project quality gates and tasks. THE SINGLE PLACE the harness learns how to
# build, test and run *this* project. Written by the bootstrap story once
# /plan-product has chosen a stack.
#
# Format:  <kind> | <id> | <required|optional> | <cwd> | <command>
#
#   kind     gate  -> run by scripts/gates.sh, must pass before a story is done
#            task  -> convenience command, run by scripts/task.sh <id>
#   id       stable name the agents refer to ("the coverage gate")
#   required required gates block story completion; optional ones only report
#   cwd      directory to run in, relative to repo root ("." for root)
#   command  the shell command; leave EMPTY to mark the gate as unconfigured
#
# Unconfigured required gates are reported as UNCONFIGURED. They are a warning
# before the bootstrap story lands and a hard failure after it (see BOOTSTRAPPED
# below).
#
# Format:  evidence | <gate id> | <extended regex>
#
# A gate that exits 0 has not necessarily done anything. `cargo test` in a
# workspace root tests one package and skips the members; a linter aimed at a
# directory that no longer exists checks nothing; a coverage threshold on a glob
# matching no files is satisfied vacuously. All of them exit 0, and exit 0 is
# not proof of work - it is the absence of a complaint, and a tool with nothing
# to do does not complain.
#
# An `evidence` line is the liveness assertion for one gate: after that gate
# exits 0, its captured output must match this regex or the gate FAILS with
# "ran but produced no evidence of work", at the gate's own severity.
#
#   evidence | unit  | test result: ok\. [1-9]
#   evidence | lint  | Checked [1-9][0-9]* files
#
# Rules:
#   - Assert VOLUME OF WORK OBSERVED, never success. Success is the exit code's
#     job. Regexes that assert success are fragile and encode the wrong idea.
#   - `|` inside the regex is fine; the parser keeps everything after field 2.
#   - `evidence | <id> | -` declares that no such output exists for this tool.
#     Use it rarely, and say why in the story that added the gate.
#   - A gate with no evidence line behaves exactly as it always did, but once
#     BOOTSTRAPPED=yes a required gate without one is reported as a warning.
#
# Canonical evidence lines per ecosystem live in the stack-profiles skill.
#
# Format:  floor | <gate id> | <minimum>
#
# An `evidence` line catches a gate that did NOTHING. A `floor` catches one that
# quietly started doing much less: a test project dropped from the workspace, a
# lint target narrowed to one directory, a suite that went from 47 tests to 3.
# All of those exit 0 and match the evidence regex.
#
# The number is measured out of the evidence match - the first run of digits at
# or after the start of it - so a floor needs an evidence line, and that regex
# must cover the whole number. `gates.sh --audit` refuses a floor without one,
# or a floor that is not a number.
#
#   evidence | unit | Tests +[1-9][0-9]* passed
#   floor    | unit | 40
#
# Rules:
#   - Raise it deliberately, in the story that adds the tests, and never lower
#     it to make a gate pass. Lowering a floor is the gate equivalent of
#     deleting a test case; if the drop is legitimate - a suite genuinely
#     split in two - say so in the story that changes it.
#   - Every full run prints `observed <n>` for any gate with an evidence line,
#     floor or not, so the number is visible before anyone commits to one.
#
# Format:  discovery | <id> | <cwd> | <command>
#
# Run by scripts/doctor.sh, never by the gates. Each one asserts that a test
# runner can actually SEE a place tests are expected to live. A coverage
# threshold on a directory no test project includes is satisfied vacuously; a
# workspace member dropped from an include list takes its whole suite with it.
# Both are invisible in the configuration and obvious the moment the runner is
# asked what it can find, which is why these are commands and not globs:
#
#   discovery | platform | . | pnpm exec vitest list | grep "src/platform/" > /dev/null
#   discovery | crates   | . | cargo test --workspace --no-run 2>&1 | grep "Compiling world-core" > /dev/null
#
# Add one for every directory carrying a coverage threshold, and for every
# workspace member whose tests must run. A claim about what a runner discovers
# is verified by running the runner.
#
# Write the matcher as `grep PATTERN > /dev/null`, NOT `grep -q PATTERN`.
# `grep -q` exits on its first match; the runner upstream of the pipe is still
# writing, takes SIGPIPE, and dies 141. This file used to show `grep -q` and so
# did four stack profiles, and a real project got "nothing discovered" on a tree
# where everything was discovered. It is size-dependent - a short listing
# finishes before grep exits and nothing happens - so it works until the suite
# grows, and the wrong lesson from a spurious MISSING is to delete the line.
# doctor.sh now runs these with pipefail off as well, so an old copied line is
# safe; write the new shape anyway, because the old one is a trap in any other
# context.
#
# Format:  slow | <gate id> | <why it is too slow to run every loop>
#
# `bash scripts/gates.sh --fast` runs every gate EXCEPT the ones named here.
#
# It exists because RED and GREEN only ever run the test command, while the
# gates judge the tests with a different and slower one - the same suite under
# coverage instrumentation, a linter, a type checker. A suite can pass RED,
# pass GREEN, pass every local gate and still fail a required gate in CI,
# because the instrumented run is slower and CI hardware is slower again. That
# happened: a property test at 1,835 ms plain and 2,644 ms instrumented, against
# a 5,000 ms default timeout, which is comfortable on a desktop and a failure on
# a runner. --fast is what lets RED ask "are these tests admissible to the gates
# that will judge them" without paying for a release bundle every loop.
#
# A gate is FAST unless a line here says otherwise, so the subset is right by
# default in a new project and wrong only where somebody said so out loud.
#
# Rules:
#   - The reason is required. `gates.sh --audit` refuses a `slow` line without
#     one, and refuses one naming a gate that does not exist - a typo there
#     excludes nothing and says nothing.
#   - Never mark a gate slow to stop it failing. That is what a waiver is for,
#     and waivers are refused on required gates for the same reason.
#   - A --fast run is never recorded in the story. It is not a full run, and
#     only a full run is evidence.

# Format:  ci-factor | <gate id> | <per-test factor> | <the CI run it came from>
#
# How much slower ONE TEST is on CI than on a developer machine, under this
# gate. Measured once from a real CI log and written down, because the obvious
# way to derive it is wrong and reads plausible.
#
# The trap: extrapolating from the gate's own wall time. A coverage gate at 3 s
# locally and 41 s in CI looks like 14x, so a 367 ms test looks like it will
# take 5,000 ms there and blow the framework's default timeout. It does not.
# Most of a coverage gate's wall time is fixed overhead - process start,
# transform, instrumentation, report generation - which does not scale with
# test compute. Measured per test, the same gate was 3.4x. Someone acting on
# the 14x would have spent a day making a test faster that was already fine.
#
#   ci-factor | coverage | 3.4 | actions run 412, "AC-4/AC-5 file 1,262 ms"
#
# Rules:
#   - Take it from a real CI log: one test's duration there over the same
#     test's duration locally, both under the same gate. `gates.sh --audit`
#     refuses a factor that is not a number, one with no source, and one
#     naming a gate that does not exist.
#   - Budget, not limit: keep any single test under a QUARTER of the
#     framework's timeout under local instrumentation. 4,275 ms against a
#     5,000 ms timeout is not a pass, it is a pending failure on slower
#     hardware.
#   - Re-measure when the runner image or the test command changes. A stale
#     factor is a guess with a citation.

# Format:  covers | <gate id> | <glob>
#
# Which paths a gate actually reads, in the paths.conf glob dialect (`**` any
# number of segments, `*` within one). Several lines per gate are fine.
#
# Without these, "All required gates passed" can be true and meaningless. A
# renderer's tests once lived in a browser-only test project; that project ran
# in the `integration` gate, marked optional because it needs a browser; the
# coverage include skipped the same directory. Three sound decisions, and
# between them every test of the story's artifact ran where nothing could
# block on it. Nothing in this file said which paths a gate reads, so nothing
# could notice.
#
# With any `covers` line present and a story active, every run of gates.sh
# (--fast included) takes the story's changed SOURCE paths - the diff against
# main, committed or not - and matches them here:
#   - read by a required gate           fine
#   - read only by optional gates       FAIL: put the gate in the story's
#                                       required_gates, or add a covers line
#                                       for a required gate that reads it
#   - read by no gate with a line       WARN: the manifest is incomplete, or
#                                       the file is genuinely ungated; say which
#
#   covers | unit        | src/core/**
#   covers | unit        | src/platform/**
#   covers | coverage    | src/core/**
#   covers | integration | src/render/**
#
# Rules:
#   - Write what the runner CAN SEE, not what the directory layout suggests.
#     A `covers | unit | src/**` over a vitest project whose include skips
#     src/render/ is a lie the check will believe. Pair each line with a
#     `discovery` line that proves it.
#   - `gates.sh --audit` refuses a line naming no gate or carrying no glob,
#     and notes when there are none at all.

# Format:  waiver | <gate id> | <why this optional gate is expected to fail>
#
# An optional gate that is known to fail - a mutation tool the stack cannot
# run yet, an integration suite waiting on a service - would otherwise WARN on
# every run forever, and the next agent learns that WARNs are ignorable. A
# waiver names the failure and where the decision is recorded; gates.sh then
# reports it as KNOWN, and WARN is reserved for something that changed. A
# waived gate still runs: when it passes, the summary says to remove the line.
# Waivers are refused on required gates - that would be a bypass, not a waiver.
#
#   waiver | mutation | stryker needs a TS compiler API TS 7 lacks; stack.md s4

# Format:  blocked-when | <gate id> | <extended regex>
#
# BLOCKED is the third state a gate can be in: not passed, not failed - the
# environment would not let it start. A required gate failed eight consecutive
# runs on one machine with `could not execute process ... (never executed) ...
# An Application Control policy has blocked this file. (os error 4551)`, which is
# Windows Smart App Control refusing an unsigned, locally built executable by
# reputation. The code was untouched; the same command passed three times on CI
# the same day. Reported as FAIL, it sent an orchestrator into six retries and an
# hour of inventing a path the harness had no word for.
#
# gates.sh already recognises the shapes that mean "this process never started" -
# `could not execute process`, `never executed`, `os error 4551`, `cannot execute
# binary file`, `command not found`, a Permission denied on a path. A
# `blocked-when` line adds one for a runner that says it differently:
#
#   blocked-when | integration | (emulator device offline|no display found)
#
# A BLOCKED required gate is not a pass: the run exits 3, and the story needs a
# PO decision, the log line quoted, and the gate verified on CI before DONE. See
# the quality-gates skill. `--audit` refuses a line naming no gate, and one with
# no pattern - which would match everything and turn every failure into a block.
#
# Do NOT add a pattern to make a failing gate stop failing. A compile error, a
# missing module and a failed assertion are all the gate doing its job.

# ############################################################################
# # VERIFIED BY BOOT-001 on 2026-09-15.                                      #
# #                                                                          #
# # Every command below has been RUN on this machine, against the real       #
# # toolchain, and every required gate has additionally been observed to     #
# # FAIL on its vacuous case. Both outputs are pasted into                   #
# # docs/backlog/stories/BOOT-001.md, `## Gate probes`.                      #
# #                                                                          #
# # The hazard this stack has, measured rather than assumed:                 #
# #                                                                          #
# #   selene  over an existing EMPTY directory -> exit 0, "0 errors".        #
# #   selene  over a MISSING directory         -> exit 1, os error 2.        #
# #   stylua  --check over an empty directory  -> exit 0, silent.            #
# #   luau-lsp analyze over an empty directory -> exit 1, "no files          #
# #           provided" (1.69.0 is honest here; do not rely on it staying    #
# #           so, which is what the counted evidence is for).                #
# #                                                                          #
# # So the silent-zero is real for lint and format, and the answer is the    #
# # same for all four static gates: THE GATE COUNTS ITS OWN INPUTS AND SAYS  #
# # THE NUMBER, and the evidence regex reads that number.                    #
# #                                                                          #
# # The count is `git ls-files` (tracked truth, not a shell glob that        #
# # expands to nothing and says nothing) FILTERED BY `[ -e ]`. The filter is #
# # not decoration and it was added because of a measured hole: `git         #
# # ls-files` lists the INDEX, so after `mv src src.probe` every source file #
# # is still "tracked", the count stays at its old value, the evidence regex #
# # is satisfied, and the gate passes over a source tree that is not there.  #
# # Tracked AND present is the property the gates actually need.             #
# #                                                                          #
# # Three things NOT to "simplify" here:                                     #
# #   - `git ls-files 'src/**/*.luau'` does NOT match `src/Foo.luau`: `**/`  #
# #     in a git pathspec matches one or more directories, never zero. That  #
# #     was the planned form and it silently undercounts a file at the top   #
# #     of src/. The verified form is a directory pathspec plus a per-path   #
# #     extension test.                                                      #
# #   - The extension test is a `case` inside the loop and NOT `| grep -E    #
# #     '\.luau$' |`. gates.sh runs with `set -o pipefail`, so on a tree     #
# #     with no .luau files grep exits 1, the whole `n=$(...)` assignment    #
# #     exits 1, the `&&` chain stops, and THE COUNT LINE IS NEVER PRINTED.  #
# #     Measured in the lint probe: the gate still failed, but on an opaque  #
# #     `exit 1` instead of "produced no evidence of work", which is the     #
# #     diagnosis this whole design exists to produce. Every stage of the    #
# #     count pipeline must exit 0 on an empty tree - which is also why the  #
# #     body is `if [ -e ]; then ... fi` and not `[ -e ] && ...`, whose      #
# #     false branch would make the `while` loop itself exit 1.              #
# #   - The `echo` comes AFTER the tool and the FIRST TOKEN OF EVERY GATE    #
# #     COMMAND IS A REAL EXECUTABLE. scripts/doctor.sh takes `awk {print    #
# #     $1}` of each command as the tool to look for on PATH, so a command   #
# #     starting `n=$(git ...` makes doctor report a permanently MISSING     #
# #     tool called `n=$(git`. Ordering costs nothing here: gates.sh only    #
# #     consults the evidence regex for a gate that already exited 0, so an  #
# #     echo the tool's failure skipped could not have been read anyway.     #
# # See docs/wiki/stack.md sections 2 and 5.                                 #
# ############################################################################

# The stack is real: unconfigured REQUIRED gates are now a hard failure rather
# than a warning. coverage, integration and mutation are optional by decision -
# see the comments on each below.
BOOTSTRAPPED=yes

# --- Gates ------------------------------------------------------------------
gate | format    | optional | . | stylua --check src tests lune && n=$(git ls-files -- src tests lune | while IFS= read -r f; do case "$f" in *.luau) if [ -e "$f" ]; then echo x; fi ;; esac; done | wc -l) && echo "stylua over $n files"
gate | lint      | required | . | selene src tests lune && n=$(git ls-files -- src tests lune | while IFS= read -r f; do case "$f" in *.luau) if [ -e "$f" ]; then echo x; fi ;; esac; done | wc -l) && echo "selene over $n files"
# The awk filter is NOT decoration and it is the single most important line in
# this file. MEASURED, luau-lsp 1.69.0, src intact in all three cases:
#
#   --sourcemap pointing at a file that does not exist
#       -> "[ERROR] Failed to load ... for workspace 'CLI'"        EXIT 0
#   --sourcemap pointing at JSON it cannot understand
#       -> "Sourcemap parsing failed, sourcemap is not loaded"     EXIT 0
#   --definitions pointing at a file that does not exist
#       -> "[ERROR] Failed to read definitions file ...
#           Extended types will not be provided"                   EXIT 0
#
# In all three the analyser CARRIES ON with no DataModel and/or no Roblox types,
# resolves almost nothing, finds nothing wrong, and exits 0 - in the gate this
# project's correctness rests on. The file count cannot see it: the files are
# all still there and still counted. The awk pass prints every line through
# unchanged and exits 1 if it saw either shape, which is what turns a degraded
# analysis into a failure. Verified both ways in BOOT-001's `## Gate probes`.
gate | typecheck | required | . | rojo sourcemap default.project.json --output sourcemap.json && test -s globalTypes.d.luau && luau-lsp analyze --sourcemap=sourcemap.json --definitions=globalTypes.d.luau --base-luaurc=.luaurc --ignore='Packages/**' src 2>&1 | awk '{print} /^\[ERROR\]|Sourcemap parsing failed/{bad=1} END{exit (bad?1:0)}' && n=$(git ls-files -- src | while IFS= read -r f; do case "$f" in *.luau) if [ -e "$f" ]; then echo x; fi ;; esac; done | wc -l) && echo "analyze over $n files"
gate | unit      | required | . | lune run test
# coverage is UNCONFIGURED AND OPTIONAL BY DECISION, not by omission.
# debug.sethook does not exist in Luau; the VM has coverage via a coverageLevel
# compile option and lua_getcoverage, and Lune exposes the compile option but NO
# way to read the data back. You can instrument, and then you cannot ask.
# Product-brief 0b amendment 5; the full reasoning and what replaces it (the unit
# floor, plus mutation) is docs/wiki/stack.md section 4. Do not configure this
# with a command that measures nothing, and do not delete the line - an
# unconfigured optional gate is visible, a missing one is forgotten.
gate | coverage  | optional | . |
gate | integration | optional | . |
# `mkdir -p build` because build/ is gitignored and does not exist in a clean
# checkout. `test -s` is inside the gate rather than trusting Rojo's exit code,
# and it earns its place: see the build probe in BOOT-001's `## Gate probes`,
# where `rojo build` exits 0 over a project whose $path does not exist and
# `test -s` is the only thing that notices.
gate | build     | required | . | mkdir -p build && rojo build default.project.json --output build/place.rbxl && test -s build/place.rbxl && echo "built $(wc -c < build/place.rbxl) bytes"
# No off-the-shelf mutation runner exists for Luau. The mandatory per-story
# mutation check runs through scripts/mutate.sh instead; see stack.md section 4.
gate | mutation  | optional | . |


# --- Left out of `gates.sh --fast` ------------------------------------------
slow | integration | needs a browser or a running service; minutes, not seconds
slow | mutation    | re-runs the suite once per mutant
# MEASURED, 2026-09-15, this machine, warm: format 219 ms, lint 224 ms,
# unit 155 ms, sourcemap 698 ms, analyze 2,256 ms, place build 125 ms.
#
# `slow | build` was planned and is DELETED: a full Rojo place build is the
# CHEAPEST command in this stack, faster than the linter. Excluding it from
# --fast bought nothing and cost RED and GREEN the one gate that notices a
# broken default.project.json. typecheck, the genuinely slow one at 2.3 s,
# stays in --fast deliberately - --!strict is this project's primary
# correctness tool and the sourcemap step it depends on rots silently; a story
# that reaches GATES having never run analysis wrote untyped Luau for an hour.

# --- Evidence of work -------------------------------------------------------
# VERIFIED against real output. The three counted lines are produced by the gate
# commands above, not by the tools, which print no file count at all.
evidence | format    | stylua over [1-9][0-9]* files
evidence | lint      | selene over [1-9][0-9]* files
evidence | typecheck | analyze over [1-9][0-9]* files
# The runner's final line is `N passed, M failed`. The regex requires BOTH
# halves so it cannot be satisfied by a stray "3 passed" in a test name, and so
# that the floor reads the pass count and not something else.
evidence | unit      | [1-9][0-9]* passed, [0-9]+ failed
evidence | build     | built [1-9][0-9]* bytes

# A floor of 1 catches a suite that VANISHED. It does not catch one that shrank
# from 120 tests to 4 - and with coverage unconfigured, nothing else will.
# EVERY STORY THAT ADDS TESTS RAISES THIS, in that story, out loud.
#
# BOOT-001 leaves unit at 1 on purpose (its `## Out of scope` says so): there is
# exactly one example suite and raising the floor here would encode the scaffold
# as a baseline. ROUND-001 is the first story that must raise it.
floor    | unit      | 1
floor    | lint      | 1

# --- What the runner can see ------------------------------------------------
# VERIFIED. `--list` is a requirement on the runner in lune/test.luau (same walk,
# print the count and each name, run nothing), not a flag that exists by default.
# Written as `grep PATTERN > /dev/null`, never `grep -q`: grep -q exits on its
# first match and the runner upstream dies 141 on SIGPIPE.
discovery | tests  | . | lune run test -- --list | grep -E '^[1-9][0-9]* tests?' > /dev/null
# The runner can see the one directory tests actually live in. `covers | unit |
# src/shared/**` is only honest while this passes.
discovery | shared | . | lune run test -- --list | grep -E 'tests/shared/' > /dev/null
# Asked of ROJO rather than of default.project.json, because the typecheck gate's
# worst failure mode is a sourcemap that resolves NOTHING - analysis then runs
# over an empty world and reports zero errors. This asserts the mapping reaches a
# real file on disk.
discovery | sourcemap | . | rojo sourcemap default.project.json --output sourcemap.json && grep -F 'src/shared/Scaffold.luau' sourcemap.json > /dev/null

# --- What each gate reads ---------------------------------------------------
# Taken from what each tool was OBSERVED to read, not from the directory layout.
#
# lint, typecheck and build are handed `src` as a whole: selene and luau-lsp walk
# it, and rojo maps all four subtrees through default.project.json.
covers | lint      | src/**
covers | typecheck | src/**
covers | build     | src/**
# unit is narrower ON PURPOSE. `lune run test -- --list` reports four tests, all
# under tests/shared/, and the only production module any of them requires is
# src/shared/Scaffold.luau. A `covers | unit | src/**` here would be a lie the
# check would believe - and the whole point of these lines is to FAIL when a
# story adds src/server/ code that no required test gate reads. ROUND-001 and
# NET-001 widen this as they add the suites that justify it.
covers | unit      | src/shared/**

# --- Tasks ------------------------------------------------------------------
# `install` fetches globalTypes.d.luau, the Roblox API type dump luau-lsp needs.
# It is generated, not authored, and it is PINNED TO THE luau-lsp VERSION IN
# rokit.toml rather than to `main`: the dump and the analyser that reads it move
# together, and a dump from a different day produces type errors that look like
# code errors. The version is read out of rokit.toml so it cannot drift from the
# pin. Source: https://github.com/JohnnyMorganz/luau-lsp, scripts/globalTypes.d.luau
#
# `--no-trust-check` is deliberate and it is not only for CI. Without it Rokit
# PROMPTS before installing a tool it has not seen, and a prompt in the one
# command every fresh checkout runs is a command that hangs an agent forever.
# The trust boundary is the committed rokit.toml: it names six tools at exact
# versions, it is reviewed like any other config change, and paths.conf
# classifies it `config` so RED cannot touch it.
task | install | - | . | rokit install --no-trust-check && wally install && v=$(sed -n 's/^luau-lsp = ".*@\(.*\)"$/\1/p' rokit.toml) && test -n "$v" && curl -fsSL -o globalTypes.d.luau "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/$v/scripts/globalTypes.d.luau" && test -s globalTypes.d.luau && echo "globalTypes.d.luau for luau-lsp $v: $(wc -c < globalTypes.d.luau) bytes"
task | dev     | - | . | rojo serve default.project.json
task | test    | - | . | lune run test
task | fmt     | - | . | stylua src tests lune
# `lint` duplicates the lint gate's tool on purpose: doctor.sh only checks the
# FIRST token of each gate and task command, and the lint gate's first token is
# `selene` only by the ordering above - this line is what keeps selene checked
# if that ever changes, and it is the command to run while iterating.
task | lint    | - | . | selene src tests lune
task | analyze | - | . | luau-lsp analyze --sourcemap=sourcemap.json --definitions=globalTypes.d.luau --base-luaurc=.luaurc --ignore='Packages/**' src
task | deps    | - | . | wally install
